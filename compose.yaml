# Solo desarrollo local. No contiene datos ciudadanos ni configuración de producción.
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: naranjos
      POSTGRES_USER: naranjos
      POSTGRES_PASSWORD: local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - naranjos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naranjos -d naranjos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  naranjos_db:
